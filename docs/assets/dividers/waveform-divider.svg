<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 32" width="100%" height="32" fill="none">
  <style>
    .wave-line {
      stroke: url(#waveGrad);
      stroke-width: 2.5;
      stroke-linecap: round;
    }
    .pulse-dot {
      fill: #10b981;
      animation: pulseMove 6s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulseMove {
      0% { transform: translateX(0px); opacity: 0.2; }
      50% { transform: translateX(600px); opacity: 1; }
      100% { transform: translateX(1200px); opacity: 0.2; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse-dot {
        animation: none;
        opacity: 0.8;
      }
    }
  </style>
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="25%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="1"/>
      <stop offset="75%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Baseline with central acoustic amplitude modulation peaks -->
  <path d="M 0 16 L 300 16 Q 330 16 345 8 T 375 16 Q 405 16 420 2 L 435 30 L 450 6 L 465 26 L 480 10 L 495 22 L 510 16 L 690 16 Q 705 16 720 4 L 735 28 L 750 8 L 765 24 L 780 12 L 795 16 L 1200 16" class="wave-line" />

  <!-- Glowing Animated Pulse Accent -->
  <circle cx="0" cy="16" r="4" class="pulse-dot" />
</svg>
