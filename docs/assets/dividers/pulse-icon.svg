<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <style>
    .pulse-node {
      animation: nodePulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse-node { animation: none; }
    }
    @keyframes nodePulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; }
    }
  </style>
  <circle cx="12" cy="12" r="8" fill="#10b981" fill-opacity="0.2" class="pulse-node" />
  <path d="M 4 12 H 8 L 10 7 L 14 17 L 16 12 H 20" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
